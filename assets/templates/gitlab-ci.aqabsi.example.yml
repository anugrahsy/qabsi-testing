stages:
  - verify
  - qa-report
  - publish

qa_verify:
  stage: verify
  script:
    - ./project-specific-test-command
    - ./project-specific-result-normalizer > aqabsi-run.json
  artifacts:
    when: always
    paths:
      - aqabsi-run.json
      - test-results/
    reports:
      junit: test-results/junit.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

aqabsi_report:
  stage: qa-report
  needs:
    - job: qa_verify
      artifacts: true
  script:
    - python3 .aqabsi/scripts/generate_artifacts.py aqabsi-run.json aqabsi-artifacts
  artifacts:
    when: always
    paths:
      - aqabsi-artifacts/

aqabsi_publish:
  stage: publish
  needs:
    - job: aqabsi_report
      artifacts: true
  script:
    - ./authorized-project-specific-publisher aqabsi-artifacts
  when: manual
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
